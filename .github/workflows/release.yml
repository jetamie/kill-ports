name: Release

# 触发方式：
# 1) 推送 v 开头的 tag（如 v0.1.0）→ 自动构建并创建 Release
# 2) 手动运行（Actions → Release → Run workflow），填写要发布的 tag
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（例如 v0.1.0，需与 tauri.conf.json 中 version 一致）"
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows bundles
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Type check & build frontend
        run: npm run build

      - name: Build app and upload to Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag }}
          releaseName: "KillPorts ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag }}"
          releaseBody: |
            ## KillPorts ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag }}

            Windows 桌面版构建产物（GitHub Actions 自动生成）。

            | 文件 | 说明 |
            | --- | --- |
            | `KillPorts_*_x64-setup.exe` | NSIS 安装包（推荐） |
            | `KillPorts_*_x64_en-US.msi` | MSI 安装包（适合企业分发） |

            功能：枚举本机监听端口（TCP LISTEN / UDP 绑定），关联进程名与 PID，支持一键强制结束进程。
          releaseDraft: false
          prerelease: false
          args: --bundles nsis,msi
